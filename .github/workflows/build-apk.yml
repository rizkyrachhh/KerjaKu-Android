name: Build KerjaKu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KerjaKu_v1.2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Fix application name
        run: |
         sed -i 's/android:label="KerjaKu 1.2"/android:label="KerjaKu"/' source/KerjaKuAndroid/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: source/KerjaKuAndroid
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
         mv source/KerjaKuAndroid/app/build/outputs/apk/debug/app-debug.apk source/KerjaKuAndroid/app/build/outputs/apk/debug/KerjaKu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KerjaKu-APK
          path: source/KerjaKuAndroid/app/build/outputs/apk/debug/KerjaKu.apk
          if-no-files-found: error
          retention-days: 14
