name: Build KerjaKu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KerjaKu_Android_Project_v1.1_ikon-baru.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o KerjaKu_Android_Project_v1.1_ikon-baru.zip -d source

      - name: Build debug APK
        working-directory: source/KerjaKuAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KerjaKu-APK
          path: source/KerjaKuAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
